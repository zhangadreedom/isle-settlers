[package]
name = "isle-server"
description = "Online game server for Isle Settlers: rooms, invite links, reconnects."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
isle-core = { workspace = true, features = ["serde"] }
isle-ai.workspace = true
isle-proto.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
argon2 = "0.5"
getrandom = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.11"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"

[lints]
workspace = true
