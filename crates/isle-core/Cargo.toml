[package]
name = "isle-core"
description = "Rules engine for Isle Settlers: board topology, game state, legal moves."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Serialize public types (actions, events, phases...) for the network protocol.
serde = ["dep:serde"]
# Derive TypeScript declarations (used by isle-proto to export web types).
ts = ["serde", "dep:ts-rs"]

[dependencies]
serde = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }

[lints]
workspace = true
