[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
repository = "https://github.com/zhangadreedom/isle-settlers"

[workspace.dependencies]
isle-core = { path = "crates/isle-core" }
isle-ai = { path = "crates/isle-ai" }
isle-proto = { path = "crates/isle-proto" }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.154"
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }
wasm-bindgen = "=0.2.130"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
needless_range_loop = "allow"

# Native builds (server, AI, simulator): maximum speed.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Browser builds: smaller binary, abort on panic.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"

# Keep tests fast but with optimized dependencies.
[profile.test]
opt-level = 1
