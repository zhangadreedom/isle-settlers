name: CI

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-and-web:
    name: Rust Workspace, WASM & Web Client
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.130

      - name: Install wasm-bindgen-cli 0.2.130
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.130'; then
            cargo install wasm-bindgen-cli --version 0.2.130 --locked --force
          fi
          wasm-bindgen --version

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm 10.28.0
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Verify deterministic engine fingerprint
        run: |
          fp="$(cargo run --release -p isle-ai --example fingerprint | tr -d '[:space:]')"
          echo "Engine fingerprint: ${fp}"
          if [ "${fp}" != "b862d3b3842bae2d" ]; then
            echo "::error::Expected deterministic fingerprint b862d3b3842bae2d, got ${fp}"
            exit 1
          fi

      - name: Verify TypeScript protocol sync
        run: cargo test -p isle-proto --features ts --test typescript

      - name: Build WASM, production web, and embedded web
        run: pnpm build && pnpm build:embed

  docker:
    name: Docker Production Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        env:
          DOCKER_BUILDKIT: '1'
        run: docker build -t isle-settlers:ci .
